services:
  proxydeck:
    image: amslertec/proxydeck:${IMAGE_TAG:-latest}
    container_name: proxydeck
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # SECURITY (Audit 2026-07-23, H1): Node-Backend-Port (8080) NICHT mehr zum Host mappen —
    # er umging nginx/WAF/TLS. Zugriff erfolgt ausschließlich über 80/443 (nginx).
    ports: ["80:80","443:443"]
    environment:
      TZ: ${TZ:-Europe/Zurich}
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER is required}
      ADMIN_PASS: ${ADMIN_PASS:?ADMIN_PASS is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_ACCOUNT: ${ACME_ACCOUNT:-}
      # Auto-Setup: Creates proxy + SSL on first start
      FRONTEND_URL: ${FRONTEND_URL:-}
      PGHOST: ${PGHOST:-db}
      PGUSER: ${PGUSER:-proxydeck}
      PGPASSWORD: ${PGPASSWORD:?PGPASSWORD muss gesetzt sein - siehe Rotation-Runbook}
      PGDATABASE: ${PGDATABASE:-proxydeck}
      PGPORT: "5432"
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PERMBAN_FILE: /etc/nginx/permanent_bans.d/permanent_bans.conf
      NGINX_CERT_DIR: /etc/nginx/certs
      LETSENCRYPT_BASE: /etc/letsencrypt/live
      LE_CONFIG_DIR: /etc/letsencrypt
      LE_WORK_DIR: /var/lib/letsencrypt
      LE_LOGS_DIR: /var/log/letsencrypt
      # Performance settings
      ENABLE_H3: "1"
      MICROCACHE_SECS: "5"
      ISOLATION_HEADERS: "0"
    volumes:
      - confd:/etc/nginx/conf.d
      - data:/var/lib/proxydeck
      - certs:/etc/nginx/certs
      - acme:/var/www/acme
      - le_etc:/etc/letsencrypt
      - le_var:/var/lib/letsencrypt
      - le_log:/var/log/letsencrypt
      - ./backup:/var/lib/proxydeck/backups
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 3g
    memswap_limit: 3.5g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health && curl -fsS -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: proxydeck-db
    shm_size: 512m
    environment:
      POSTGRES_DB: ${PGDATABASE:-proxydeck}
      POSTGRES_USER: ${PGUSER:-proxydeck}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD muss gesetzt sein - siehe Rotation-Runbook}
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1024MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c max_connections=600
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1.5g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-proxydeck} -d ${PGDATABASE:-proxydeck}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis for distributed rate limiting & caching
  redis:
    image: redis:7-alpine
    container_name: proxydeck-redis
    # SECURITY (Audit 2026-07-23, M7): requirepass nur wenn REDIS_PASSWORD gesetzt (opt-in).
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 300m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  confd:
  data:
  certs:
  acme:
  le_etc:
  le_var:
  le_log:
  pgdata:
  redis_data:

